name: Volt Compiler Cross-Platform Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-volt-core:
    name: Build Volt Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Team
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-android
            os: ubuntu-latest

          # Windows
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest

          # macOS (Apple Silicon & Intel)
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Cross Linkers untuk Linux/Android/Windows di runner Ubuntu
      - name: Install Cross Linkers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu gcc-mingw-w64-x86-64

      # Setup Rust Toolchain & Target
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Build Release Binary
      - name: Build Binary
        run: cargo build --target ${{ matrix.target }} --release

      # Package Binaries into dist/
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/volt_compiler.exe dist/volt-compiler-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/volt_compiler dist/volt-compiler-${{ matrix.target }}
          fi

      # Upload Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volt-compiler-${{ matrix.target }}
          path: dist/*
