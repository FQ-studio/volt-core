name: Volt Compiler Windows & macOS Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-volt-core:
    name: Build Volt Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest

          # macOS (Apple Silicon & Intel)
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Cross-Linker untuk Windows di Ubuntu runner
      - name: Install Windows Linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      # Setup Rust
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Build Release
      - name: Build Binary
        run: cargo build --target ${{ matrix.target }} --release

      # Package Binaries into dist/
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/volt_compiler.exe dist/volt-compiler-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/volt_compiler dist/volt-compiler-${{ matrix.target }}
          fi

      # Upload Build Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volt-compiler-${{ matrix.target }}
          path: dist/*
